services:
  - type: web
    name: superapp-server
    runtime: node
    plan: free
    numInstances: 1 # required: socket.io + SQLite can't run on multiple instances
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.12.2
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false # set in dashboard to https://deepak0kr0mishra.github.io (comma-separated list allowed)
    # PERSISTENCE UPGRADE (paid Starter plan and up):
    # Free Render has NO disk — every redeploy wipes SQLite + uploads.
    # Until then use Admin → Download backup before updating, Restore after.
    # To enable real persistence later: upgrade to Starter, add a disk with
    #   name: superapp-data, mountPath: /var/superapp-data, sizeGB: 1
    # and set env DATA_DIR=/var/superapp-data. No code changes needed.

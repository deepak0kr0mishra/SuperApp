services:
  - type: web
    name: superapp-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
    disk:
      name: superapp-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1